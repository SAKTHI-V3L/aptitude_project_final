<!-- templates/results.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Results</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 p-10 rounded-2xl shadow-2xl max-w-xl text-center">
    <h1 class="text-4xl font-bold mb-6 text-indigo-400">Test Completed</h1>
    <p class="text-xl mb-4">Final Rating: <span class="font-bold text-white">{{ rating }}</span></p>
    <p class="text-xl mb-6">Score: <span class="font-bold text-green-400">{{ score }}</span></p>
  </div>
</body>
</html>
